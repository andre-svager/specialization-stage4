apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "45.28.0"
    helm:
      values: |
        prometheus:
          enabled: true
          prometheusSpec:
            retention: 1d
            retentionSize: ""
            storageSpec:
              emptyDir:
                medium: Memory
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector:
              any: true
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorNamespaceSelector:
              any: true
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        grafana:
          enabled: true
          defaultDashboardsEnabled: true
          adminPassword: admin
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          service:
            type: ClusterIP
            port: 3000
            targetPort: 3000
          grafana.ini:
            server:
              root_url: http://localhost:3000
          
          # Sidecar watcher to dynamically ingest ConfigMaps with dashboards & datasources
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
            datasources:
              enabled: true

          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  url: http://prometheus-operated.monitoring.svc.cluster.local:9090
                  access: proxy
                  editable: true
                - name: Loki
                  type: loki
                  url: http://loki-stack.monitoring.svc.cluster.local:3100
                  access: proxy
                  editable: true

        alertmanager:
          enabled: true
          alertmanagerSpec:
            retention: 24h
            storage:
              emptyDir:
                medium: Memory
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        kube-state-metrics:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        node-exporter:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        prometheus-node-exporter:
          enabled: true

        defaultRules:
          create: true
          rules:
            alertmanager: true
            etcd: true
            configReloaders: true
            general: true
            k8s: true
            kubeApiserver: true
            kubeApiserverAvailability: true
            kubeApiserverBurnrate: true
            kubeApiserverHistogram: true
            kubeApiserverSlos: true
            kubeControllerManager: true
            kubelet: true
            kubeProxy: true
            kubeScheduler: true
            kubeStateMetrics: true
            network: true
            node: true
            nodeRecorder: true
            prometheus: true
            prometheusOperator: true
            time: true
            windows: false