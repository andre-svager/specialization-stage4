apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.88.0"
    helm:
      values: |
        mode: deployment
        
        # Configure OTel pipelines
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          
          exporters:
            # Send metrics to Prometheus
            prometheus:
              endpoint: 0.0.0.0:8889
            # Send logs to Loki
            loki:
              endpoint: http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push

          service:
            pipelines:
              metrics:
                receivers: [otlp]
                exporters: [prometheus]
              logs:
                receivers: [otlp]
                exporters: [loki]

        # Expose ports for scrape/ingress
        ports:
          otlp-grpc:
            enabled: true
            containerPort: 4317
            servicePort: 4317
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
          prometheus:
            enabled: true
            containerPort: 8889
            servicePort: 8889