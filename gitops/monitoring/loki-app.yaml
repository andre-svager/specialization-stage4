apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Starts after Prometheus/Grafana
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.2" # Standard stable version for the stack
    helm:
      values: |
        loki:
          enabled: true
          isDefault: false
          persistence:
            enabled: false # This stops the CrashLoopBackOff!
          # Configure Loki to use ephemeral emptyDir storage for testing
          storageClassName: ""
        
        promtail:
          enabled: true
          # Promtail runs on every node to scrape logs and send them to Loki
          config:
            clients:
              - url: http://loki-stack:3100/loki/api/v1/push