apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Starts after core storage/monitoring services
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.88.0"
    helm:
      values: |
        mode: deployment

        image:
          repository: otel/opentelemetry-collector-contrib
          tag: 0.88.0

        replicaCount: 2

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            prometheus:
              config:
                scrape_configs:
                  - job_name: 'otel-collector'
                    scrape_interval: 15s
                    static_configs:
                      - targets: ['0.0.0.0:8888']
            filelog:
              include: ["/var/log/containers/*.log"]
              start_at: beginning
              operators:
                - type: regex
                  regex: '^(?P<time>[^Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
                  timestamp:
                    layout: '2006-01-02T15:04:05.999999999Z'
                    layout_type: strptime
                    parse_from: attributes.time
                    location: UTC

          processors:
            batch:
              timeout: 5s
              send_batch_size: 1024
            memory_limiter:
              limit_mib: 256
              spike_limit_mib: 64
              check_interval: 5s
            resource:
              attributes:
                - key: cluster.name
                  value: togglemaster-gke
                - key: environment
                  value: staging

          exporters:
            prometheusremotewrite:
              endpoint: http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write
              tls:
                insecure: true
            loki:
              endpoint: http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push
              tls:
                insecure: true
              labels:
                environment: staging
                cluster: togglemaster-gke
            logging:
              loglevel: debug

          service:
            pipelines:
              metrics:
                receivers: [otlp, prometheus]
                processors: [batch, memory_limiter, resource]
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp, filelog]
                processors: [batch, memory_limiter, resource]
                exporters: [loki, logging]
              traces:
                receivers: [otlp]
                processors: [batch, memory_limiter, resource]
                exporters: [logging]

        ports:
          otlp:
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          prometheus:
            containerPort: 8888
            servicePort: 8888
            protocol: TCP

        service:
          type: ClusterIP