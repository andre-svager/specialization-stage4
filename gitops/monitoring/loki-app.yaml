apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.2" 
    helm:
      values: |
        loki:
          enabled: true
          isDefault: false
          
          # CRITICAL: This is what actually fixes the crash loop
          image:
            tag: 2.9.3
            
          persistence:
            enabled: false
          
          # Your custom config injected here:
          config:
            auth_enabled: false
            server:
              http_listen_port: 3100
            common:
              path_prefix: /data/loki
              storage:
                filesystem:
                  chunks_directory: /data/loki/chunks
                  rules_directory: /data/loki/rules
              replication_factor: 1
              ring:
                kvstore:
                  store: inmemory
            schema_config:
              configs:
                - from: 2020-10-24
                  store: boltdb-shipper
                  object_store: filesystem
                  schema: v11
                  index:
                    prefix: index_
                    period: 24h
            ruler:
              alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        
        promtail:
          enabled: true
          config:
            clients:
              - url: http://loki-stack:3100/loki/api/v1/push