apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
  labels:
    app: prometheus
data:
  alert-rules.yaml: |
    groups:
      - name: togglemaster-alerts
        interval: 30s
        rules:
          # High Error Rate Alert for auth-service
          - alert: HighErrorRateAuth
            expr: |
              rate(http_requests_total{service="auth-service",status=~"5.."}[5m]) 
              / rate(http_requests_total{service="auth-service"}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              service: auth-service
            annotations:
              summary: "Auth service error rate > 5%"
              description: "Auth service error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

          # High Error Rate Alert for all services
          - alert: HighErrorRateAnyService
            expr: |
              rate(http_requests_total{status=~"5.."}[5m]) 
              / rate(http_requests_total[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Service {{ $labels.service }} error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

          # High Latency Alert
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency detected"
              description: "Service {{ $labels.service }} p95 latency is {{ $value }}s for the last 5 minutes."

          # High CPU Usage Alert
          - alert: HighCPUUsage
            expr: |
              100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "Node {{ $labels.instance }} CPU usage is {{ $value }}% for the last 5 minutes."

          # High Memory Usage Alert
          - alert: HighMemoryUsage
            expr: |
              100 * (1 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Node {{ $labels.instance }} memory usage is {{ $value }}% for the last 5 minutes."

          # Pod Restart Alert
          - alert: PodRestarting
            expr: |
              increase(kube_pod_container_status_restarts_total[1h]) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod restarting frequently"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last hour."

          # Service Down Alert
          - alert: ServiceDown
            expr: |
              up{job="kubernetes-pods"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "Service {{ $labels.service }} is down for the last 2 minutes."

          # Disk Space Alert
          - alert: LowDiskSpace
            expr: |
              (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Low disk space"
              description: "Node {{ $labels.instance }} has less than 10% disk space available."
